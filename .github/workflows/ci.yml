name: Registry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run assets:check

  validate:
    needs: public-checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require successful public checks
        if: needs.public-checks.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changed connector cards
        id: cards
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --no-renames --name-only --diff-filter=AMT "$BASE_SHA...$HEAD_SHA" -- 'connectors/*.json' ':(exclude)connectors/*.sample.json')
          if [[ -n "$files" ]]; then
            git show "$BASE_SHA:scripts/check-maintainer-status.cjs" > "$RUNNER_TEMP/check-maintainer-status.cjs"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require maintainer verification for this PR revision
        if: steps.cards.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const check = require(process.env.RUNNER_TEMP + '/check-maintainer-status.cjs');
            await check({ github, context, core });

  rebuild-catalog:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Commit rebuilt catalog
        run: |
          if git diff --quiet -- catalog.json catalog-stats.json README.md docs/CONNECTOR-DIRECTORY.md docs/RECENT-ADDITIONS.md docs/ANNOUNCEMENT-DRAFT.md docs/CATEGORY-OVERVIEW.md; then
            echo "catalog products are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-stats.json README.md docs/CONNECTOR-DIRECTORY.md docs/RECENT-ADDITIONS.md docs/ANNOUNCEMENT-DRAFT.md docs/CATEGORY-OVERVIEW.md
          git commit -m "QMCP-2014 chore: rebuild catalog products [skip ci]"
          git push

  purge-cdn:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: rebuild-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Purge and verify jsDelivr catalog
        env:
          JSDELIVR_VERIFY_ATTEMPTS: 6
          JSDELIVR_VERIFY_DELAY_MS: 2000
        run: node scripts/purge-jsdelivr-cache.mjs catalog.json
