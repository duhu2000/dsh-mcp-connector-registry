name: Registry CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event.pull_request != null }}

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run assets:check

  validate:
    needs: public-checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require successful public checks
        if: needs.public-checks.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        if: github.event.pull_request != null
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changed connector cards
        id: cards
        if: github.event.pull_request != null
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --no-renames --name-only --diff-filter=AMT "$BASE_SHA...$HEAD_SHA" -- 'connectors/*.json' ':(exclude)connectors/*.sample.json')
          if [[ -n "$files" ]]; then
            git show "$BASE_SHA:scripts/check-maintainer-review.cjs" > "$RUNNER_TEMP/check-maintainer-review.cjs"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require maintainer verification for this PR revision
        if: steps.cards.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const check = require(process.env.RUNNER_TEMP + '/check-maintainer-review.cjs');
            await check({ github, context, core });

  rebuild-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - name: Check the committed catalog against the build
        id: compare
        shell: bash
        run: |
          mapfile -t products < .github/catalog-products.txt
          git add --intent-to-add -- "${products[@]}"
          git diff --binary --no-ext-diff HEAD -- "${products[@]}" > "$RUNNER_TEMP/catalog-products.patch"
          if [[ -s "$RUNNER_TEMP/catalog-products.patch" ]]; then
            git diff --stat HEAD -- "${products[@]}"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::error::Run npm run build and commit the generated changes to this PR, or download the catalog-products artifact and apply catalog-products.patch."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'pull_request' && steps.compare.outputs.stale == 'true'
        with:
          name: catalog-products
          path: ${{ runner.temp }}/catalog-products.patch
          retention-days: 7

  purge-cdn:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [validate, rebuild-catalog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Purge and verify jsDelivr catalog
        env:
          JSDELIVR_VERIFY_ATTEMPTS: 6
          JSDELIVR_VERIFY_DELAY_MS: 2000
        run: node scripts/purge-jsdelivr-cache.mjs catalog.json
